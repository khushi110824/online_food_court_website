<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Menu</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
    }
    header {
        background-color: #333;
        color: #fff;
        padding: 20px;
        text-align: center;
    }
    h1 {
        margin: 0;
    }
    .menu-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        padding: 20px;
    }
    .menu-item {
        width: 300px;
        background-color: #fff;
        border-radius: 10px;
        margin: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        overflow: hidden;
    }
    .menu-item img {
        width: 100%;
        height: auto;
    }
    .menu-item-info {
        padding: 20px;
    }
    .menu-item h2 {
        margin-top: 0;
    }
    .menu-item p {
        margin: 10px 0;
    }
    #img
    {
        height: 450px;
    }
</style>
</head>
<body>
    <header>
        <h1>Restaurant Menu</h1>
    </header>
    <div class="menu-container">
        <div class="menu-item">
            <img src="shake.jpg" alt="Shake">
            <div class="menu-item-info">
                <h2>Shakes</h2>
                <p>Delicious shakes to satisfy your cravings.</p>
                <p>Price: $5</p>
            </div>
        </div>
        <div class="menu-item">
            <img id="img"  src="pizza.jpg" alt="Pizza">
            <div class="menu-item-info">
                <h2>Pizza</h2>
                <p>Authentic wood-fired pizza made with fresh ingredients.</p>
                <p>Price: $10</p>
            </div>
        </div>
        <div class="menu-item">
            <img id="img" src="momos.jpg" alt="Momos">
            <div class="menu-item-info">
                <h2>Momos</h2>
                <p>Steamed or fried dumplings filled with savory goodness.</p>
                <p>Price: $8</p>
            </div>
        </div>
    </div>
    
    <center><button class="order-btn">Order Now</button></center>

</body>
</html>
